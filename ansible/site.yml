- name: Validate installation mode
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require a supported mode
      ansible.builtin.assert:
        that: shell_mode in shell_modes
        fail_msg: "shell_mode must be one of {{ shell_modes | join(', ') }}"
        quiet: true
      tags: [always]

    - name: Require supported regional conversion
      ansible.builtin.assert:
        that: shell_host_regional_errors | default([]) | length == 0
        fail_msg: "{{ shell_host_regional_errors | default(['Host regional conversion failed.']) | join('; ') }}"
        quiet: true
      when: not (ansible_run_tags | length == 1 and 'dev_drive' in ansible_run_tags)
      tags: [always]

- name: Configure Windows, MSYS2 and Linux hosts
  hosts: windows:linux:wsl
  gather_facts: false
  # free runs every host without waiting for the others, including the Windows connection and the WSL distributions.
  strategy: free
  tasks:
    - name: Configure Windows and MSYS2
      ansible.builtin.include_role:
        name: windows
      when: "'windows' in group_names"
      tags: [always]

    - name: Configure Linux
      ansible.builtin.include_role:
        name: linux
      when: "'windows' not in group_names"
      tags: [always]
