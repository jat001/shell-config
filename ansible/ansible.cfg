[defaults]
library = library
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
host_key_checking = True
forks = 8

[ssh_connection]
pipelining = True
# The su become path never asks for a password, and systemd 262's pam_systemd writes
# OSC 3008 session markers to any allocated pty. Without -tt those markers stay out
# of module output, so the run has no "junk after the JSON data" warnings.
usetty = False
# accept-new records the dedicated sshd key on first use. A changed key still fails closed.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
