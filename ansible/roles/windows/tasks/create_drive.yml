- name: Create the missing development VHDX
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'create_drive.ps1') }}"
    parameters:
      Path: "{{ shell_create_drive_path }}"
      SizeGiB: "{{ shell_create_drive_size }}"
      FileSystem: "{{ shell_create_drive_filesystem }}"
  when: shell_elevated | bool

- name: Create the missing development VHDX with administrator approval
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'elevate.ps1') }}"
    parameters:
      Description: "Create the development VHDX {{ shell_create_drive_path }}"
      Command: >-
        & ([scriptblock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(
        '{{ lookup('ansible.builtin.file', 'create_drive.ps1') | b64encode }}'))))
        -Path '{{ shell_create_drive_path | replace("'", "''") }}'
        -SizeGiB {{ shell_create_drive_size | int }}
        -FileSystem '{{ shell_create_drive_filesystem }}'
  when:
    - not shell_elevated | bool
    - shell_elevate | bool

- name: Report missing development VHDX that requires elevation
  ansible.builtin.debug:
    msg: "Creating {{ shell_create_drive_path }} requires administrator rights (shell_elevate is disabled)."
  when:
    - not shell_elevated | bool
    - not shell_elevate | bool
