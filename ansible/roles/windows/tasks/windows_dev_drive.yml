- name: Resolve Windows development drive
  ansible.builtin.set_fact:
    shell_windows_dev_drive: "{{ shell_configuration.environments.windows.dev_drive | default({}) }}"

- name: Resolve Windows development VHDX
  ansible.builtin.set_fact:
    shell_windows_dev_drive_vhd: "{{ shell_home ~ shell_backslash
      ~ (shell_windows_dev_drive.vhd | replace('/', shell_backslash)) }}"
  when: shell_windows_dev_drive | length > 0

- name: Identify legacy script registration
  ansible.builtin.set_fact:
    shell_windows_dev_drive_legacy_key: "{{ '{' ~ (('shell-dev-drive:' ~ shell_windows_dev_drive_vhd | lower) | to_uuid) ~ '}' }}"
  when: shell_windows_dev_drive | length > 0

- name: Inspect Windows development VHDX
  ansible.windows.win_stat:
    path: "{{ shell_windows_dev_drive_vhd }}"
    get_checksum: false
  register: shell_windows_dev_drive_file
  when: shell_windows_dev_drive | length > 0

- name: Require Windows development VHDX
  ansible.builtin.assert:
    that: shell_windows_dev_drive_file.stat.exists
    fail_msg: "Configured Windows development VHDX does not exist: {{ shell_windows_dev_drive_vhd }}"
    quiet: true
  when:
    - shell_windows_dev_drive | length > 0
    - not ansible_check_mode

- name: Read Windows development drive
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'dev_drive.ps1') }}"
    parameters:
      Path: "{{ shell_windows_dev_drive_vhd }}"
      LegacyKey: "{{ shell_windows_dev_drive_legacy_key }}"
      Wait: 30
  register: shell_windows_dev_drive_state
  changed_when: false
  check_mode: false
  when:
    - shell_windows_dev_drive | length > 0
    - shell_windows_dev_drive_file.stat.exists

- name: Resolve Windows development drive letter
  ansible.builtin.set_fact:
    shell_dev_drive_letter: "{{ shell_windows_dev_drive_state.result.letter
      | default(ansible_facts.env.DEV_DRIVE | default(''), true) }}"
  when: shell_windows_dev_drive | length > 0

- name: Require Windows development drive letter
  ansible.builtin.assert:
    that: shell_dev_drive_letter is regex('^[A-Za-z]:$')
    fail_msg: "The Windows development drive {{ shell_windows_dev_drive_vhd }} is not attached or has no drive letter."
    quiet: true
  when:
    - shell_windows_dev_drive | length > 0
    - not ansible_check_mode

- name: Publish Windows development drive letter
  ansible.windows.win_environment:
    level: user
    name: DEV_DRIVE
    value: "{{ shell_dev_drive_letter }}"
  when:
    - shell_windows_dev_drive | length > 0
    - shell_dev_drive_letter | length > 0
