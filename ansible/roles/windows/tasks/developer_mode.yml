- name: Enable Developer Mode
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
    name: AllowDevelopmentWithoutDevLicense
    data: 1
    type: dword
  register: shell_developer_mode_enabled
  when:
    - (shell_developer_mode.value | default(0)) != 1
    - shell_elevated | bool

- name: Enable Developer Mode with administrator approval
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'elevate.ps1') }}"
    parameters:
      Description: Enable Windows Developer Mode
      Command: >-
        $null = New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force;
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord
  register: shell_developer_mode_approved
  when:
    - (shell_developer_mode.value | default(0)) != 1
    - not shell_elevated | bool
    - shell_elevate | bool

- name: Record Developer Mode
  ansible.builtin.set_fact:
    shell_symlinks: true
  when: shell_developer_mode_enabled is changed or shell_developer_mode_approved is changed
