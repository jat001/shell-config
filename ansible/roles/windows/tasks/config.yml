- name: Require symbolic link support
  ansible.builtin.assert:
    that: shell_symlinks | bool
    fail_msg: >-
      Creating symbolic links without elevation requires Windows Developer Mode;
      run the init mode to enable it, or enable it in Settings > System > For developers.
    quiet: true

- name: Install Windows entries and links
  win_shell_paths:
    items: "{{ shell_entries | shell_windows_items(shell_home, shell_repository,
      shell_fish_directories, shell_plugin_content, shell_clink_content) }}"

# HOME is a property of the account that is logged in. Another -WindowsHome must not change this account's variable.
- name: Set user HOME
  ansible.windows.win_environment:
    name: HOME
    value: "{{ shell_home }}"
    level: user
  when: shell_current_home | bool

- name: Manage Clink autorun
  ansible.builtin.import_tasks: clink.yml
  when: shell_current_home | bool
  tags: [clink]
