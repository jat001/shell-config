- name: Configure WSL
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'ini.ps1') }}"
    parameters:
      Path: "{{ shell_home }}\\.wslconfig"
      Settings: "{{ shell_configuration.environments.windows.wslconfig | to_json }}"
  register: shell_wslconfig
  when: shell_configuration.environments.windows.wslconfig is defined

# --shutdown drops every distribution, including the one carrying this connection, so the play only reports the change.
- name: Report WSL settings change
  ansible.builtin.debug:
    msg: .wslconfig changed; it takes effect after wsl.exe --shutdown.
  when: shell_wslconfig.changed | default(false)
