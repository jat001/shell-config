- name: Resolve WSL development drive
  ansible.builtin.set_fact:
    shell_dev_drive: "{{ shell_configuration.environments.wsl.dev_drive | default({}) }}"
    shell_dev_drive_enabled: "{{ shell_configuration.environments.wsl.dev_drive is defined and
      (shell_dev_drive_task | string | lower == 'true' or
       (shell_dev_drive_task == 'auto' and (groups['wsl'] | default([]) | length > 0))) }}"
    shell_dev_drive_description: "Shared shell configuration: attach the WSL development VHDX."
    shell_dev_drive_executable: "{{ ansible_facts.env.SystemRoot }}\\System32\\wsl.exe"

- name: Validate WSL development drive configuration
  ansible.builtin.assert:
    that:
      - shell_dev_drive[item] | default('') | length > 0
    fail_msg: "Missing WSL development drive setting: {{ item }}"
    quiet: true
  loop: [vhd, mountpoint, filesystem, uuid, task, schtasks]
  when: shell_dev_drive_enabled | bool

- name: Validate WSL development drive values
  ansible.builtin.assert:
    that:
      - shell_dev_drive.mountpoint is regex('^/\S+/[A-Za-z0-9][A-Za-z0-9._-]*$')
      - shell_dev_drive.filesystem is regex('^[a-z0-9]+$')
      - shell_dev_drive.uuid is regex('^[0-9a-fA-F-]{36}$')
      - shell_dev_drive.task is regex('^[A-Za-z0-9][A-Za-z0-9 ._-]*$')
      - shell_dev_drive.options | default('') is not regex('["\r\n]')
      - shell_dev_drive.vhd is not regex('["\r\n]')
    fail_msg: Invalid WSL development drive configuration.
    quiet: true
  when: shell_dev_drive_enabled | bool

- name: Resolve WSL development drive task
  ansible.builtin.set_fact:
    shell_dev_drive_vhd: "{{ shell_home ~ shell_backslash ~ (shell_dev_drive.vhd | replace('/', shell_backslash)) }}"
  when: shell_dev_drive_enabled | bool

- name: Resolve WSL development drive arguments
  ansible.builtin.set_fact:
    shell_dev_drive_arguments: "{{ '--mount --vhd \"' ~ shell_dev_drive_vhd ~ '\" --type '
      ~ shell_dev_drive.filesystem ~ ' --name ' ~ (shell_dev_drive.mountpoint | basename)
      ~ ((' --options \"' ~ shell_dev_drive.options ~ '\"') if shell_dev_drive.options | default('') else '') }}"
  when: shell_dev_drive_enabled | bool

- name: Inspect WSL development VHDX
  ansible.windows.win_stat:
    path: "{{ shell_dev_drive_vhd }}"
  register: shell_dev_drive_file
  when: shell_dev_drive_enabled | bool

- name: Require WSL development VHDX
  ansible.builtin.assert:
    that: shell_dev_drive_file.stat.exists
    fail_msg: "Configured WSL development VHDX does not exist: {{ shell_dev_drive_vhd }}"
    quiet: true
  when: shell_dev_drive_enabled | bool

- name: Inspect existing WSL development drive task
  community.windows.win_scheduled_task_stat:
    path: \
    name: "{{ shell_dev_drive.task }}"
  register: shell_dev_drive_existing
  when: shell_dev_drive_enabled | bool

- name: Refuse unrelated scheduled task
  ansible.builtin.assert:
    that: >-
      not shell_dev_drive_existing.task_exists or
      shell_dev_drive_existing.registration_info.description == shell_dev_drive_description or
      (shell_dev_drive_existing.actions | length == 1 and
       (shell_dev_drive_existing.actions[0].path | lower) == (shell_dev_drive_executable | lower) and
       shell_dev_drive_existing.actions[0].arguments == shell_dev_drive_arguments)
    fail_msg: "An unrelated scheduled task already uses this name: {{ shell_dev_drive.task }}"
    quiet: true
  when: shell_dev_drive_enabled | bool

- name: Register WSL development drive task
  community.windows.win_scheduled_task:
    path: \
    name: "{{ shell_dev_drive.task }}"
    description: "{{ shell_dev_drive_description }}"
    actions:
      - path: "{{ shell_dev_drive_executable }}"
        arguments: "{{ shell_dev_drive_arguments }}"
    username: "{{ ansible_facts.user_sid }}"
    logon_type: interactive_token
    run_level: highest
    enabled: true
    allow_demand_start: true
    disallow_start_if_on_batteries: false
    stop_if_going_on_batteries: false
    multiple_instances: 2
    execution_time_limit: PT1M
  when: shell_dev_drive_enabled | bool
