- name: Install Python for Ansible
  ansible.builtin.raw: |
    set -e
    command -v python3 >/dev/null 2>&1 && exit 0
    [ "$(id -u)" -eq 0 ] || sudo=sudo
    if command -v pacman >/dev/null 2>&1; then
        [ -s /etc/pacman.d/gnupg/pubring.gpg ] ||
            { $sudo pacman-key --init && $sudo pacman-key --populate archlinux; }
        $sudo pacman -Syu --needed --noconfirm python
    elif command -v apt-get >/dev/null 2>&1; then
        $sudo apt-get update
        DEBIAN_FRONTEND=noninteractive $sudo apt-get install -y --no-install-recommends python3
    else
        echo 'Unsupported distribution' >&2
        exit 1
    fi
    echo installed-python
  register: shell_python
  changed_when: "'installed-python' in shell_python.stdout"
  when: shell_mode != 'update'
  tags: [always]

- name: Gather Linux facts
  ansible.builtin.setup:
    gather_subset: [min]
  tags: [always]

- name: Resolve Linux layout
  ansible.builtin.import_tasks: layout.yml
  tags: [always]

- name: Install Linux packages
  ansible.builtin.include_tasks:
    file: "packages_{{ ansible_facts.os_family | lower }}.yml"
    apply:
      become: "{{ shell_become }}"
      tags: [packages]
  tags: [packages]

- name: Create WSL user
  ansible.builtin.import_tasks: user.yml
  become: "{{ shell_become }}"
  when: shell_user is defined
  tags: [packages, config, dev_drive]

- name: Install AUR packages
  ansible.builtin.import_tasks: aur.yml
  become: "{{ shell_become }}"
  when: ansible_facts.os_family == 'Archlinux'
  tags: [packages]

- name: Read configured accounts
  ansible.builtin.getent:
    database: passwd
  tags: [always]

- name: Prepare shared XDG homes
  ansible.builtin.import_tasks: xdg_homes.yml
  become: "{{ shell_become }}"
  when:
    - shell_mode != 'init'
    - shell_configuration.environments.wsl.dev_drive is defined
  tags: [config]

# Each account gets the same entries, links, user units and XDG directories.
- name: Configure accounts
  ansible.builtin.include_tasks:
    file: account.yml
    apply:
      become: "{{ shell_account != ansible_facts.user_id }}"
      become_user: "{{ shell_account }}"
      become_method: ansible.builtin.su
  loop: "{{ shell_accounts | select('in', ansible_facts.getent_passwd) | list }}"
  loop_control:
    loop_var: shell_account
  tags: [always]

- name: Report accounts that do not exist yet
  ansible.builtin.debug:
    msg: "{{ item }} does not exist yet; it is configured on the next run."
  loop: "{{ shell_accounts | reject('in', ansible_facts.getent_passwd) | list }}"
  tags: [config, dev_drive]
