- name: Read WSL accounts
  ansible.builtin.getent:
    database: passwd
  when: shell_configuration.environments.wsl.default_user is defined

- name: Require existing default WSL user
  ansible.builtin.assert:
    that: >-
      shell_configuration.environments.wsl.default_user in ansible_facts.getent_passwd
      or shell_configuration.environments.wsl.default_user == shell_user | default('')
    fail_msg: "The default WSL user {{ shell_configuration.environments.wsl.default_user }} does not exist."
    quiet: true
  when: shell_configuration.environments.wsl.default_user is defined

- name: Resolve WSL distribution settings
  ansible.builtin.set_fact:
    shell_wsl_conf: "{{ shell_wsl_conf_entries + ([{'section': 'user', 'option': 'default',
      'value': shell_configuration.environments.wsl.default_user}]
      if shell_configuration.environments.wsl.default_user is defined else []) }}"
  vars:
    shell_wsl_conf_entries: >-
      {%- set entries = [] -%}
      {%- for section, options in (shell_configuration.environments.wsl.wsl_conf | default({})).items() -%}
      {%- for option, value in options.items() -%}
      {%- set _ = entries.append({'section': section, 'option': option, 'value': value | string}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ entries }}

- name: Configure WSL distribution
  community.general.ini_file:
    path: /etc/wsl.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ shell_wsl_conf }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  register: shell_wsl_conf_result

- name: Report WSL distribution settings change
  ansible.builtin.debug:
    msg: /etc/wsl.conf changed; it takes effect after wsl.exe --terminate for this distribution.
  when: shell_wsl_conf_result.changed
