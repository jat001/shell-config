- name: Refresh openSUSE Tumbleweed package metadata
  ansible.builtin.command:
    argv: [zypper, --non-interactive, refresh]
  register: shell_zypper_refresh
  changed_when: false
  check_mode: false
  until: shell_zypper_refresh is succeeded
  retries: 3
  delay: 10

- name: Resolve openSUSE Tumbleweed package probe
  ansible.builtin.set_fact:
    shell_zypper_probe: "{{ (shell_zypper_packages + (shell_releases | map(attribute='name') | list)
      + ['ble.sh', 'zsh-antidote']) | unique }}"

# zypper prints nothing and exits 104 for a name it does not know, which is what selects the archive or release fallback.
- name: Inspect available openSUSE Tumbleweed packages
  ansible.builtin.command:
    argv: "{{ ['zypper', '--non-interactive', 'info', item] }}"
  loop: "{{ shell_zypper_probe }}"
  loop_control:
    label: "{{ item }}"
  register: shell_zypper_probe_result
  changed_when: false
  check_mode: false
  failed_when: shell_zypper_probe_result.rc not in [0, 104]

- name: Resolve available openSUSE Tumbleweed packages
  ansible.builtin.set_fact:
    shell_package_available: "{{ shell_zypper_probe_result.results
      | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    shell_fallback_releases: "{{ shell_releases
      | rejectattr('name', 'in', shell_zypper_probe_result.results
        | selectattr('rc', 'equalto', 0) | map(attribute='item') | list) | list }}"

- name: Require nonoptional openSUSE Tumbleweed packages
  ansible.builtin.assert:
    that: shell_zypper_packages | difference(shell_package_available)
      | difference(['ble.sh', 'zsh-antidote'])
      | difference(shell_releases | map(attribute='name') | list) | length == 0
    fail_msg: "Packages unavailable: {{ shell_zypper_packages | difference(shell_package_available) }}"
    quiet: true

- name: Install or update openSUSE Tumbleweed packages
  community.general.zypper:
    name: "{{ shell_package_available }}"
    state: "{{ 'latest' if shell_mode == 'update' else 'present' }}"
    install_recommends: false
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10
  when: shell_package_available | length > 0

- name: Manage remaining release packages and their update timer
  ansible.builtin.import_tasks: release_updates.yml

- name: Install unavailable openSUSE Tumbleweed shell dependencies
  ansible.builtin.import_tasks: fallbacks.yml
