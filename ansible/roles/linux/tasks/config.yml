# Created even when the development drive is mounted. Oh My Posh ignores OMP_CACHE_DIR until the directory exists.
# OMP_CACHE_DIR points here so oh-my-posh's init scripts, which name its binary, stay in this distribution;
# oh-my-posh only uses the directory if it exists.
- name: Create local cache directory
  ansible.builtin.file:
    path: "{{ shell_user_home }}/.cache"
    state: directory

# `config reset -w` writes nothing unless .config/nushell already exists, and it still exits 0.
# --no-config-file also writes nothing. `config nu --default` is a different embedded file.
# The fingerprint check refuses a capture that rewrote the account's own files.
# A distribution without nu, or a nu that writes nothing, leaves the directory empty and succeeds.
- name: Capture unmodified Nushell configuration
  ansible.builtin.command:
    argv:
      - sh
      - "{{ shell_repository }}/ansible/roles/linux/files/nushell-defaults.sh"
      - "{{ '/tmp/shell-nushell-defaults-' ~ shell_account_uid }}"
      - "{{ shell_user_home }}"
  changed_when: false
  check_mode: false

- name: Install entries and shared links
  shell_paths:
    items: "{{ shell_entries | shell_unix_items(shell_user_home, shell_windows_home_path,
      shell_repository, shell_fish_directories, shell_plugin_content,
      nushell_defaults='/tmp/shell-nushell-defaults-' ~ shell_account_uid) }}"

- name: Plan configured links
  ansible.builtin.command:
    argv:
      - jq
      - --arg
      - platform
      - wsl
      - --arg
      - home
      - "{{ shell_user_home }}"
      - --arg
      - windows_home
      - "{{ shell_windows_home_path }}"
      - --arg
      - mode
      - plan
      - -f
      - "{{ shell_repository }}/common.jq"
      - "{{ shell_repository }}/common.json"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' ~ shell_account_uid }}"
  register: shell_link_plan
  changed_when: false
  check_mode: false

- name: Resolve configured links
  ansible.builtin.set_fact:
    shell_links: "{{ (shell_link_plan.stdout | from_json).links | default({}) }}"

- name: Require absolute configured links
  ansible.builtin.assert:
    that:
      - item.key is match('/')
      - item.value is match('/')
    fail_msg: "Configured link paths must be absolute: {{ item.key }}"
    quiet: true
  loop: "{{ shell_links | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Inspect configured link targets
  ansible.builtin.stat:
    path: "{{ item.value }}"
  loop: "{{ shell_links | dict2items }}"
  loop_control:
    label: "{{ item.value }}"
  register: shell_link_targets

# Targets this account cannot read, such as another account's private .ssh, are skipped as well.
- name: Select configured links with readable targets
  ansible.builtin.set_fact:
    shell_links_available: "{{ shell_link_targets.results | selectattr('stat.exists')
      | selectattr('stat.readable') | map(attribute='item') | items2dict }}"

- name: Report configured links without readable targets
  ansible.builtin.debug:
    msg: "Skipped links whose targets do not exist or are not readable by {{ shell_account }}:
      {{ shell_link_targets.results | map(attribute='item.key') | reject('in', shell_links_available)
      | join(', ') }}"
  when: shell_links_available | length < shell_links | length

- name: Install configured links
  shell_paths:
    items: "{{ shell_links_available | shell_link_items }}"
  when: shell_links_available | length > 0
