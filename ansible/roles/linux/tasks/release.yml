- name: "Inspect {{ shell_release.name }}"
  ansible.builtin.shell: |
    link=/usr/local/bin/{{ shell_release.command | quote }}
    if [ -L "$link" ]; then
        case $(readlink "$link") in
            {{ shell_release_root }}/*) echo managed; exit 0 ;;
        esac
    fi
    command -v {{ shell_release.command | quote }} >/dev/null && echo external || echo missing
  register: shell_release_state
  changed_when: false
  check_mode: false

- name: "Resolve latest {{ shell_release.name }} release"
  ansible.builtin.uri:
    url: "https://github.com/{{ shell_release.repository }}/releases/latest"
    method: HEAD
    follow_redirects: none
    status_code: [301, 302]
  register: shell_release_latest
  when: >-
    shell_release_state.stdout == 'missing' or
    (shell_release_state.stdout == 'managed' and shell_mode == 'update')

- name: "Install {{ shell_release.name }}"
  when: shell_release_latest is not skipped
  vars:
    shell_release_tag: "{{ shell_release_latest.location | basename }}"
    shell_release_version: "{{ shell_release_tag | regex_replace('^v', '') }}"
    shell_release_asset: "{{ shell_release.asset | replace('{version}', shell_release_version) }}"
    shell_release_directory: "{{ shell_release_root }}/{{ shell_release.name }}/{{ shell_release_tag }}"
    shell_release_url: "https://github.com/{{ shell_release.repository }}/releases/download/{{ shell_release_tag }}/{{ shell_release_asset }}"
    shell_release_binary: "{{ shell_release_directory }}/{{
      ((shell_release.archive | replace('{version}', shell_release_version)) ~ '/')
      if shell_release.archive | default('') else '' }}{{ shell_release.command }}"
  block:
    - name: "Inspect selected {{ shell_release.name }} release"
      ansible.builtin.stat:
        path: "{{ shell_release_binary }}"
      register: shell_release_installed

    - name: "Create {{ shell_release.name }} directory"
      ansible.builtin.file:
        path: "{{ shell_release_directory }}"
        state: directory
        mode: "0755"

    - name: "Download {{ shell_release.name }}"
      ansible.builtin.get_url:
        url: "{{ shell_release_url }}"
        dest: "{{ shell_release_binary }}"
        mode: "0755"
      when:
        - shell_release.archive is not defined
        - not shell_release_installed.stat.exists

    - name: "Extract {{ shell_release.name }}"
      ansible.builtin.unarchive:
        src: "{{ shell_release_url }}"
        dest: "{{ shell_release_directory }}"
        remote_src: true
      when:
        - shell_release.archive is defined
        - not shell_release_installed.stat.exists

    - name: "Link {{ shell_release.command }}"
      ansible.builtin.file:
        path: "/usr/local/bin/{{ shell_release.command }}"
        src: "{{ shell_release_binary }}"
        state: link
        force: true

    - name: "Find previous {{ shell_release.name }} releases"
      ansible.builtin.find:
        paths: "{{ shell_release_root }}/{{ shell_release.name }}"
        file_type: directory
        excludes: ["{{ shell_release_tag }}"]
      register: shell_release_previous

    - name: "Remove previous {{ shell_release.name }} releases"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ shell_release_previous.files }}"
      loop_control:
        label: "{{ item.path }}"
