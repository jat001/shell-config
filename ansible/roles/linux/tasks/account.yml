- name: Resolve account paths
  ansible.builtin.set_fact:
    shell_account_uid: "{{ ansible_facts.getent_passwd[shell_account][1] }}"
    shell_user_home: "{{ ansible_facts.getent_passwd[shell_account][4] }}"
  tags: [always]

# init still links the repository when a development drive is configured, because that service reads the script from it.
- name: Link shared repository
  shell_paths:
    items:
      - path: "{{ shell_user_home }}/.config/shell"
        state: link
        src: "{{ shell_repository }}"
  when: shell_mode != 'init' or shell_configuration.environments.wsl.dev_drive is defined
  tags: [config, dev_drive]

- name: Deploy Linux configuration
  ansible.builtin.import_tasks: config.yml
  when: shell_mode != 'init'
  tags: [config]

- name: Deploy systemd user units
  ansible.builtin.import_tasks: systemd.yml
  tags: [config, dev_drive]

# After the user units, which mount the development drive.
- name: Plan shared XDG directories
  ansible.builtin.command:
    argv:
      - jq
      - --arg
      - platform
      - wsl
      - --arg
      - home
      - "{{ shell_user_home }}"
      - --arg
      - windows_home
      - "{{ shell_windows_home_path }}"
      - --rawfile
      - mounts
      - /proc/self/mounts
      - --arg
      - mode
      - plan
      - -f
      - "{{ shell_repository }}/common.jq"
      - "{{ shell_repository }}/common.json"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' ~ shell_account_uid }}"
  register: shell_xdg_plan
  changed_when: false
  check_mode: false
  tags: [config, packages]

- name: Share XDG data and state through the development drive
  ansible.builtin.import_tasks: xdg.yml
  when: shell_mode != 'init'
  tags: [config]

- name: Install PowerShell modules
  ansible.builtin.import_tasks: powershell.yml
  tags: [packages]
