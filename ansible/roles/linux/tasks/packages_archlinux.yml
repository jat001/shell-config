- name: Inspect archlinuxcn repository
  ansible.builtin.command:
    argv: [grep, -q, '^\[archlinuxcn\]', /etc/pacman.conf]
  register: shell_archlinuxcn
  changed_when: false
  check_mode: false
  failed_when: shell_archlinuxcn.rc > 1

- name: Add archlinuxcn repository
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} shell configuration archlinuxcn"
    block: |
      [archlinuxcn]
      Server = {{ shell_archlinuxcn_server }}
  when:
    - shell_archlinuxcn.rc == 1
    - shell_mode != 'update'

- name: Inspect missing repository packages
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T', 'archlinuxcn-keyring'] + shell_pacman_packages + shell_archlinuxcn_packages }}"
  register: shell_pacman_missing
  changed_when: false
  check_mode: false
  failed_when: shell_pacman_missing.rc not in [0, 127]

- name: Initialize pacman signing key
  ansible.builtin.command:
    argv: [pacman-key, --init]
  when: "'archlinuxcn-keyring' in shell_pacman_missing.stdout_lines"

- name: Trust archlinuxcn packager key
  ansible.builtin.command:
    argv: [pacman-key, --lsign-key, farseerfc@archlinux.org]
  when: "'archlinuxcn-keyring' in shell_pacman_missing.stdout_lines"

- name: Upgrade Arch Linux
  community.general.pacman:
    update_cache: true
    upgrade: true
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10
  when: shell_mode == 'update' or shell_pacman_missing.rc == 127

- name: Install archlinuxcn keyring
  community.general.pacman:
    name: archlinuxcn-keyring
    state: present
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10

- name: Install repository packages
  community.general.pacman:
    name: "{{ shell_pacman_packages + shell_archlinuxcn_packages }}"
    state: present
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10

- name: Inspect missing AUR packages
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T'] + shell_aur_packages }}"
  register: shell_aur_missing
  changed_when: false
  check_mode: false
  failed_when: shell_aur_missing.rc not in [0, 127]

- name: Create AUR build user
  ansible.builtin.user:
    name: "{{ shell_aur_builder }}"
    system: true
    create_home: true
    shell: /usr/bin/nologin
  when: shell_aur_missing.rc == 127 or shell_mode == 'update'

- name: Allow AUR build user to run pacman
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ shell_aur_builder }}"
    content: "{{ shell_aur_builder }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
    mode: "0440"
    validate: visudo -cf %s
  when: shell_aur_missing.rc == 127 or shell_mode == 'update'

- name: Create AUR build cache
  ansible.builtin.file:
    path: "{{ shell_aur_cache }}"
    state: directory
    owner: "{{ shell_aur_builder }}"
    mode: "0755"
  when: shell_aur_missing.rc == 127 or shell_mode == 'update'

- name: Install AUR packages
  ansible.builtin.command:
    argv: "{{ ['sudo', '-u', shell_aur_builder, '-H', 'yay', '-S', '--needed', '--noconfirm',
      '--answerdiff', 'None', '--answerclean', 'None', '--removemake', '--builddir', shell_aur_cache]
      + shell_aur_missing.stdout_lines }}"
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10
  when: shell_aur_missing.rc == 127

- name: Read foreign packages
  ansible.builtin.command:
    argv: [pacman, -Qm]
  register: shell_aur_before
  changed_when: false
  check_mode: false
  when: shell_mode == 'update'

- name: Update AUR packages
  ansible.builtin.command:
    argv: [sudo, -u, "{{ shell_aur_builder }}", -H, yay, -Sua, --noconfirm,
           --answerdiff, None, --answerclean, None, --removemake, --builddir, "{{ shell_aur_cache }}"]
  changed_when: false
  when: shell_mode == 'update'

- name: Compare foreign packages
  ansible.builtin.command:
    argv: [pacman, -Qm]
  register: shell_aur_after
  changed_when: shell_aur_after.stdout != shell_aur_before.stdout
  when: shell_mode == 'update'
