- name: Require regional conversion
  ansible.builtin.assert:
    that: shell_host_regional_errors | default([]) | length == 0
    fail_msg: "{{ shell_host_regional_errors | default(['Host regional conversion failed.']) | join('; ') }}"
    quiet: true

- name: Resolve required locales
  ansible.builtin.set_fact:
    shell_required_locales: "{{ ([shell_host_locale] +
      ([] if shell_host_locale is match('^en_') else ['en_US.UTF-8']) +
      ([] if shell_host_lc_all == shell_host_locale or shell_host_lc_all in ['C', 'C.UTF-8', 'POSIX']
        else [shell_host_lc_all])) | unique }}"

- name: Read supported locales
  ansible.builtin.slurp:
    path: /etc/locale.gen
  register: shell_locale_definitions
  when: ansible_facts.os_family not in ['Suse', 'RedHat']

- name: Require host locale support
  ansible.builtin.assert:
    that: (shell_locale_definitions.content | b64decode) is search(
      '(?m)^#?\s*' ~ (item | regex_escape) ~ '\s+UTF-8\s*$')
    fail_msg: "Locale {{ item }} is not supported by this target's /etc/locale.gen."
    quiet: true
  loop: "{{ shell_required_locales }}"
  loop_control:
    label: "{{ item }}"
  when: ansible_facts.os_family not in ['Suse', 'RedHat']

- name: Inspect Arch locale sources
  ansible.builtin.stat:
    path: "/usr/share/i18n/locales/{{ item.split('.')[0] }}"
  register: shell_locale_source
  loop: "{{ shell_required_locales }}"
  loop_control:
    label: "{{ item }}"
  when: ansible_facts.os_family == 'Archlinux'

- name: Resolve missing Arch locale sources
  ansible.builtin.set_fact:
    shell_missing_locale_sources: "{{ shell_locale_source.results |
      selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}"
  when: ansible_facts.os_family == 'Archlinux'

- name: Read Arch package extraction rules
  ansible.builtin.slurp:
    path: /etc/pacman.conf
  register: shell_pacman_configuration
  when:
    - ansible_facts.os_family == 'Archlinux'
    - shell_missing_locale_sources | length > 0

- name: Require restorable Arch locale source
  ansible.builtin.assert:
    that: (shell_pacman_configuration.content | b64decode) is search('(?m)^NoExtract\s*=')
    fail_msg: "Cannot place the locale extraction rule in the pacman options section."
    quiet: true
  when:
    - ansible_facts.os_family == 'Archlinux'
    - shell_missing_locale_sources | length > 0

- name: Allow host locale source extraction
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^NoExtract\s*=.*!usr/share/i18n/locales/{{ item.split(".")[0] }}(?:\s|$)'
    line: "NoExtract  = !usr/share/i18n/locales/{{ item.split('.')[0] }}"
    insertafter: '^NoExtract'
  loop: "{{ shell_missing_locale_sources }}"
  loop_control:
    label: "{{ item }}"
  when:
    - ansible_facts.os_family == 'Archlinux'
    - shell_missing_locale_sources | length > 0

- name: Restore Arch locale source
  ansible.builtin.command:
    argv: [pacman, -S, --noconfirm, glibc]
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10
  when:
    - ansible_facts.os_family == 'Archlinux'
    - shell_missing_locale_sources | length > 0

- name: Inspect host time zone data
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ shell_host_timezone_iana }}"
  register: shell_timezone_data

- name: Require host time zone data
  ansible.builtin.assert:
    that: shell_timezone_data.stat.exists
    fail_msg: "Time zone data is missing for {{ shell_host_timezone_iana }}."
    quiet: true

- name: Set system local time
  ansible.builtin.file:
    path: /etc/localtime
    src: "/usr/share/zoneinfo/{{ shell_host_timezone_iana }}"
    state: link
    force: true

- name: Set Debian time zone name
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ shell_host_timezone_iana }}\n"
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'

# Fedora has no /etc/locale.gen; each language comes from a glibc-langpack RPM.
- name: Resolve Fedora locale packages
  ansible.builtin.set_fact:
    shell_fedora_langpacks: "{{ shell_required_locales | select('match', '^[A-Za-z]+_')
      | map('regex_replace', '_.*$', '') | map('lower') | unique
      | map('regex_replace', '^', 'glibc-langpack-') | list }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Install Fedora locale packages
  ansible.builtin.dnf5:
    name: "{{ shell_fedora_langpacks }}"
    state: present
    install_weak_deps: false
  register: shell_fedora_locale_packages
  until: shell_fedora_locale_packages is succeeded
  retries: 3
  delay: 10
  when:
    - ansible_facts.os_family == 'RedHat'
    - shell_fedora_langpacks | length > 0

- name: Inspect generated locales
  ansible.builtin.command:
    argv: [locale, -a]
  register: shell_available_locales
  changed_when: false
  failed_when: false
  check_mode: false

# A preview of a distribution that has never been configured runs before glibc-locale is installed.
- name: Require generated locale listing
  ansible.builtin.assert:
    that: shell_available_locales.rc == 0
    fail_msg: "Could not list the generated locales: {{ shell_available_locales.stderr | default('') }}"
    quiet: true
  when: not ansible_check_mode

# glibc-locale ships compiled locales; there is no locale.gen and no locale-gen to run.
- name: Require host locale support on SUSE
  ansible.builtin.assert:
    that: (item | lower | replace('-', '')) in (shell_available_locales.stdout_lines
      | map('lower') | map('replace', '-', '') | list)
    fail_msg: "Locale {{ item }} is not provided by glibc-locale on this target."
    quiet: true
  loop: "{{ shell_required_locales }}"
  loop_control:
    label: "{{ item }}"
  when:
    - ansible_facts.os_family == 'Suse'
    - shell_available_locales.rc == 0

# glibc-langpack RPMs provide compiled locales; there is no locale.gen and no locale-gen to run.
- name: Require host locale support on Fedora
  ansible.builtin.assert:
    that: (item | lower | replace('-', '')) in (shell_available_locales.stdout_lines
      | map('lower') | map('replace', '-', '') | list)
    fail_msg: "Locale {{ item }} is not provided by the installed glibc language packs on this target."
    quiet: true
  loop: "{{ shell_required_locales }}"
  loop_control:
    label: "{{ item }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - not ansible_check_mode
    - shell_available_locales.rc == 0

- name: Configure host locale entries
  ansible.builtin.script: locale_gen.py /etc/locale.gen
  environment:
    SHELL_REQUIRED_LOCALES: "{{ shell_required_locales | to_json }}"
    SHELL_CHECK_MODE: "{{ ansible_check_mode | lower }}"
  register: shell_locale_entry
  changed_when: shell_locale_entry.stdout == 'changed'
  check_mode: false
  when: ansible_facts.os_family not in ['Suse', 'RedHat']

- name: Generate host locale
  ansible.builtin.command:
    argv: [locale-gen]
  when:
    - ansible_facts.os_family not in ['Suse', 'RedHat']
    - shell_locale_entry.changed | default(false) or
      (shell_required_locales | map('lower') | map('replace', '-', '') | list |
      difference(shell_available_locales.stdout_lines | map('lower') | map('replace', '-', '') | list) |
      length > 0)

- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG={{ shell_host_locale }}"
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Set system locale override
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LC_ALL='
    line: "LC_ALL={{ shell_host_lc_all }}"

- name: Set Debian session locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG={{ shell_host_locale }}"
    create: true
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'

- name: Set Debian session locale override
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LC_ALL='
    line: "LC_ALL={{ shell_host_lc_all }}"
  when: ansible_facts.os_family == 'Debian'
