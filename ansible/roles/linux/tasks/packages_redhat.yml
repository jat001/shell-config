- name: Refresh Fedora Linux package metadata
  ansible.builtin.command:
    argv: [dnf, --quiet, makecache]
  register: shell_dnf_refresh
  changed_when: false
  check_mode: false
  until: shell_dnf_refresh is succeeded
  retries: 3
  delay: 10

- name: Resolve Fedora Linux package probe
  ansible.builtin.set_fact:
    shell_dnf_probe: "{{ (shell_redhat_packages + (shell_releases | map(attribute='name') | list)
      + ['ble.sh', 'zsh-antidote']) | unique }}"

# DNF5 reports an unknown name with a non-zero status, which selects the archive or release fallback.
- name: Inspect available Fedora Linux packages
  ansible.builtin.command:
    argv: "{{ ['dnf', '--quiet', 'info', item] }}"
  loop: "{{ shell_dnf_probe }}"
  loop_control:
    label: "{{ item }}"
  register: shell_dnf_probe_result
  changed_when: false
  check_mode: false
  failed_when: false

- name: Resolve available Fedora Linux packages
  ansible.builtin.set_fact:
    shell_package_available: "{{ shell_dnf_probe_result.results
      | selectattr('rc', 'equalto', 0) | rejectattr('stdout', 'equalto', '')
      | map(attribute='item') | list }}"
    shell_fallback_releases: "{{ shell_releases
      | rejectattr('name', 'in', shell_dnf_probe_result.results
        | selectattr('rc', 'equalto', 0) | rejectattr('stdout', 'equalto', '')
        | map(attribute='item') | list) | list }}"

- name: Require nonoptional Fedora Linux packages
  ansible.builtin.assert:
    that: shell_redhat_packages | difference(shell_package_available)
      | difference(['ble.sh', 'zsh-antidote'])
      | difference(shell_releases | map(attribute='name') | list) | length == 0
    fail_msg: "Packages unavailable: {{ shell_redhat_packages | difference(shell_package_available) }}"
    quiet: true

- name: Install or update Fedora Linux packages
  ansible.builtin.dnf5:
    name: "{{ shell_package_available }}"
    state: "{{ 'latest' if shell_mode == 'update' else 'present' }}"
    install_weak_deps: false
  register: shell_network_result
  until: shell_network_result is succeeded
  retries: 3
  delay: 10
  when: shell_package_available | length > 0

- name: Manage remaining release packages and their update timer
  ansible.builtin.import_tasks: release_updates.yml

- name: Install unavailable Fedora Linux shell dependencies
  ansible.builtin.import_tasks: fallbacks.yml
