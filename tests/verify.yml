- name: Verify simulated WSL hosts
  hosts: linux
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - ../ansible/group_vars/all/main.yml
  vars:
    windows_home: /mnt/c/Users/shell
    home: "{{ ansible_facts.user_dir }}"
    shell_environment:
      WSL_DISTRO_NAME: test
      XDG_RUNTIME_DIR: /run/user/0
      TERM: xterm-256color
    expected_links:
      .config/shell: "{{ windows_home }}/.config/shell"
      .config/oh-my-posh: "{{ windows_home }}/.config/shell/oh-my-posh"
      .zsh_plugins.txt: "{{ windows_home }}/.config/shell/zsh_plugins.txt"
      .bashrc: "{{ windows_home }}/.bashrc"
      .zshrc: "{{ windows_home }}/.zshrc"
      .inputrc: "{{ windows_home }}/.inputrc"
      .config/fish/config.fish: "{{ windows_home }}/.config/fish/config.fish"
      .config/fish/functions: "{{ windows_home }}/.config/fish/functions"
      .config/powershell/Microsoft.PowerShell_profile.ps1: "{{ windows_home }}/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
      .config/nushell/config.nu: "{{ windows_home }}/AppData/Roaming/nushell/config.nu"
      .local/bin/git.exe: "{{ windows_home }}/scoop/apps/git-without-openssh/current/cmd/git.exe"
      .ssh: "{{ windows_home }}/.ssh"
      .gitconfig: "{{ windows_home }}/.gitconfig"
      .config/systemd/user/wsl2-ssh-agent.service: "{{ windows_home }}/.config/shell/systemd/wsl2-ssh-agent.service"
      .config/systemd/user/wsl-dev-drive.service: "{{ windows_home }}/.config/shell/systemd/wsl-dev-drive.service"
  tasks:
    - name: Inspect links
      ansible.builtin.stat:
        path: "{{ home }}/{{ item.key }}"
      loop: "{{ expected_links | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: links

    - name: Check links
      ansible.builtin.assert:
        that:
          - item.stat.islnk | default(false)
          - item.stat.lnk_source == item.item.value
        fail_msg: "{{ item.item.key }} is not linked to {{ item.item.value }}"
        quiet: true
      loop: "{{ links.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Inspect a configured link without a Windows target
      ansible.builtin.stat:
        path: "{{ home }}/.aws"
        follow: false
      register: missing_link

    - name: Check that links without targets are skipped
      ansible.builtin.assert:
        that: not missing_link.stat.exists
        fail_msg: "{{ home }}/.aws was created although {{ windows_home }}/.aws does not exist"
        quiet: true

    - name: Check software
      ansible.builtin.shell: |
        set -e
        for command in jq zsh fish nu pwsh oh-my-posh git wsl2-ssh-agent; do
            command -v "$command"
        done
        for file in blesh/ble.sh zsh-antidote/antidote.zsh; do
            test -f "/usr/share/$file"
        done
      changed_when: false

    - name: Load shared environment in each shell
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      environment: "{{ shell_environment }}"
      loop:
        - name: bash
          argv: [bash, -ic, 'alias code; printf %s "$PNPM_HOME"']
        - name: zsh
          argv: [zsh, -ic, 'alias code; printf %s "$PNPM_HOME"']
        - name: fish
          argv: [fish, -c, 'functions code; printf %s "$PNPM_HOME"']
        - name: pwsh
          argv: [pwsh, -NoLogo, -Command, '(Get-Alias code).Definition; [Console]::Write($env:PNPM_HOME)']
        - name: nu
          argv: [nu, --env-config, "{{ home }}/.config/nushell/env.nu",
                 --config, "{{ home }}/.config/nushell/config.nu", -c,
                 'print (scope aliases | where name == code | get expansion.0); print -n $env.PNPM_HOME']
      loop_control:
        label: "{{ item.name }}"
      register: shells
      changed_when: false

    - name: Check shared environment
      ansible.builtin.assert:
        that:
          - (item.stdout_lines | last | default('')) is search(home ~ '/.local/share/pnpm$')
          - (windows_home ~ '/scoop/apps/vscode/current/bin/code') in item.stdout
        fail_msg: "{{ item.item.name }} printed {{ item.stdout }} / {{ item.stderr }}"
        quiet: true
      loop: "{{ shells.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Resolve XDG directories with and without the development drive
      ansible.builtin.command:
        argv: [jq, -c, --arg, platform, wsl, --arg, home, "{{ home }}", --arg, windows_home, "{{ windows_home }}",
               --arg, mounts, "{{ item }}", --arg, mode, plan,
               -f, "{{ home }}/.config/shell/common.jq", "{{ home }}/.config/shell/common.json"]
      environment: "{{ shell_environment | combine({'DEV_DRIVE': 'J:'}) }}"
      loop:
        - ''
        - /dev/sdx /mnt/wsl/dev ext4 rw 0 0
        - /dev/sdx /mnt/wsl/dev btrfs rw 0 0
      register: xdg_plans
      changed_when: false

    - name: Check XDG directories
      ansible.builtin.assert:
        that:
          - (xdg_plans.results[0].stdout | from_json).environment.XDG_DATA_HOME == home ~ '/.local/share'
          - (xdg_plans.results[1].stdout | from_json).environment.XDG_CACHE_HOME == home ~ '/.cache'
          - (xdg_plans.results[2].stdout | from_json).environment.XDG_STATE_HOME == '/mnt/wsl/dev' ~ home ~ '/.local/state'
          - (xdg_plans.results[2].stdout | from_json).environment.PNPM_HOME == '/mnt/wsl/dev' ~ home ~ '/.local/share/pnpm'
          - (xdg_plans.results[2].stdout | from_json).environment.OMP_CACHE_DIR == home ~ '/.cache'
        quiet: true

    - name: Exercise XDG migration
      ansible.builtin.shell: |
        set -eu
        root=$(mktemp -d)
        trap 'rm -rf "$root"' EXIT
        mkdir -p "$root/local/moved" "$root/local/kept" "$root/local/shell" "$root/shared/kept"
        mkdir -p "$root/local/empty/sub" "$root/shared/empty"
        echo data > "$root/local/moved/file"
        echo local > "$root/local/kept/file"
        sh -c "$script" xdg-migrate check "$root/local" "$root/shared" shell
        test -d "$root/local/moved" && test ! -L "$root/local/moved"
        sh -c "$script" xdg-migrate apply "$root/local" "$root/shared" shell
        test ! -e "$root/local/moved" && test ! -L "$root/local/moved"
        test "$(cat "$root/shared/moved/file")" = data
        test -d "$root/local/kept" && test ! -L "$root/local/kept"
        test -d "$root/local/shell" && test ! -e "$root/shared/shell"
        test ! -e "$root/local/empty"
        printf 'rerun:'
        sh -c "$script" xdg-migrate apply "$root/local" "$root/shared" shell
      environment:
        script: "{{ lookup('ansible.builtin.file', '../ansible/roles/linux/files/xdg-migrate.sh') }}"
      register: xdg_migration
      changed_when: false

    - name: Check XDG migration
      ansible.builtin.assert:
        that:
          - xdg_migration.stdout_lines[0] is match('remove .*/local/empty$')
          - xdg_migration.stdout_lines[1] is match('conflict .*/local/kept ')
          - xdg_migration.stdout_lines[2] is match('move .*/local/moved ')
          - xdg_migration.stdout is search('rerun:conflict .*/local/kept ')
          - xdg_migration.stdout is not search('rerun:.*(move|remove) ')
        fail_msg: "{{ xdg_migration.stdout }}"
        quiet: true

    - name: Read WSL user
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]

    - name: Check WSL user identity and build user removal
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd.shell[1] == '1000'
          - ansible_facts.getent_passwd.shell[2] == '1000'
          - ansible_facts.getent_group.shell[1] == '1000'
          - "'aurbuilder' not in ansible_facts.getent_passwd"
        fail_msg: "shell is {{ ansible_facts.getent_passwd.shell | default('missing') }}"
        quiet: true

    - name: Check WSL user sudo and default user
      ansible.builtin.shell: |
        set -e
        su shell -c 'sudo -n true'
        grep -qx 'default=root' /etc/wsl.conf
        grep -qx 'systemd=true' /etc/wsl.conf
        grep -qx 'appendWindowsPath=false' /etc/wsl.conf
        grep -qx 'options="metadata"' /etc/wsl.conf
      changed_when: false

    - name: Inspect WSL user links
      ansible.builtin.stat:
        path: "/home/shell/{{ item }}"
        follow: false
      loop:
        - .config/shell
        - .bashrc
        - .gitconfig
        - .config/systemd/user/default.target.wants/wsl2-ssh-agent.service
        - .ssh
      register: user_links

    - name: Check WSL user links
      ansible.builtin.assert:
        that: (item.stat.islnk | default(false)) if item.item != '.ssh' else not item.stat.exists
        fail_msg: "/home/shell/{{ item.item }}: {{ item.stat | to_json }}"
        quiet: true
      loop: "{{ user_links.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Load shared environment as the WSL user
      ansible.builtin.command:
        argv: [su, shell, -c, "bash -ic 'alias code; printf %s \"$PNPM_HOME\"'"]
      environment: "{{ shell_environment }}"
      register: user_shell
      changed_when: false

    - name: Check shared environment of the WSL user
      ansible.builtin.assert:
        that:
          - (user_shell.stdout_lines | last | default('')) == '/home/shell/.local/share/pnpm'
          - (windows_home ~ '/scoop/apps/vscode/current/bin/code') in user_shell.stdout
        fail_msg: "{{ user_shell.stdout }} / {{ user_shell.stderr }}"
        quiet: true

    - name: Load PowerShell modules for root and the WSL user
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      environment: "{{ shell_environment }}"
      loop:
        - name: root
          argv: [pwsh, -NoLogo, -Command, '(Get-Module PSCompletions).Name']
        - name: shell
          argv: [su, shell, -c, "cd && pwsh -NoLogo -Command '(Get-Module PSCompletions).Name'"]
      loop_control:
        label: "{{ item.name }}"
      register: powershell_modules
      changed_when: false

    - name: Check PowerShell modules
      ansible.builtin.assert:
        that:
          - (item.stdout_lines | last | default('')) == 'PSCompletions'
          - item.stderr | length == 0
        fail_msg: "{{ item.item.name }} printed {{ item.stdout }} / {{ item.stderr }}"
        quiet: true
      loop: "{{ powershell_modules.results }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Verify Windows Sandbox
  hosts: windows
  gather_facts: true
  vars_files:
    - ../ansible/group_vars/all/main.yml
  vars:
    shell_backslash: '\'
    home: "{{ ansible_facts.env.USERPROFILE }}"
    msys2_home: C:\msys64\home\{{ ansible_facts.env.USERNAME }}
    scoop: "{{ ansible_facts.env.USERPROFILE }}\\scoop"
  tasks:
    - name: Read Windows entries
      ansible.builtin.slurp:
        src: "{{ home }}\\{{ item.path | replace('/', shell_backslash) }}"
      loop: "{{ shell_entries }}"
      loop_control:
        label: "{{ item.path }}"
      register: entries

    - name: Check Windows entries
      ansible.builtin.assert:
        that: (item.content | b64decode) == item.item.content ~ '\n'
        fail_msg: "{{ item.item.path }} has unexpected content"
        quiet: true
      loop: "{{ entries.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Inspect Windows and MSYS2 links
      ansible.windows.win_stat:
        path: "{{ item.path }}"
      loop:
        - path: "{{ home }}\\.config\\oh-my-posh"
          target: "{{ home }}\\.config\\shell\\oh-my-posh"
        - path: "{{ home }}\\.zsh_plugins.txt"
          target: "{{ home }}\\.config\\shell\\zsh_plugins.txt"
        - path: "{{ home }}\\AppData\\Local\\clink\\clink_settings"
          target: "{{ home }}\\.config\\shell\\common.clink_settings"
        - path: "{{ msys2_home }}\\.config\\shell"
          target: "{{ home }}\\.config\\shell"
        - path: "{{ msys2_home }}\\.bashrc"
          target: "{{ home }}\\.bashrc"
        - path: "{{ msys2_home }}\\.local\\share\\antidote"
          target: "{{ home }}\\.local\\share\\antidote"
      loop_control:
        label: "{{ item.path }}"
      register: windows_links

    - name: Check Windows and MSYS2 links
      ansible.builtin.assert:
        that:
          - item.stat.islnk | default(false)
          - (item.stat.lnk_target | lower) == (item.item.target | lower)
        fail_msg: "{{ item.item.path }} -> {{ item.stat.lnk_target | default('missing') }}"
        quiet: true
      loop: "{{ windows_links.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Check user HOME
      ansible.windows.win_powershell:
        script: "[Environment]::GetEnvironmentVariable('HOME', 'User')"
      register: user_home
      changed_when: false
      failed_when: user_home.output[0] != home

    - name: Check Windows software
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "{{ scoop }}\shims;$env:PATH"
          foreach ($command in 'git', 'jq', 'oh-my-posh', 'clink', 'nu', 'pwsh') {
              $null = Get-Command $command
          }
          $output = & pwsh -NoLogo -Command '[Console]::Write($env:HOME); Get-Module PSCompletions -ListAvailable | Out-Null' 2>&1
          if ($LASTEXITCODE -ne 0) { throw "pwsh profile failed: $output" }
          $output
      register: windows_software
      changed_when: false

    - name: Check Clink autorun and interactive injection
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          & C:\shell-repo\tests\clink.ps1 -Root '{{ scoop }}' `
              -Installer C:\shell-repo\ansible\roles\windows\files\clink.ps1
      register: clink_verification
      failed_when: "'interactive injection passed.' not in (clink_verification.output | join(' '))"
      tags: [clink]

    - name: Check MSYS2 shells
      ansible.windows.win_command:
        argv:
          - C:\msys64\usr\bin\zsh.exe
          - -lic
          - whence -p oh-my-posh jq git fish
      environment:
        MSYSTEM: UCRT64
        CHERE_INVOKING: "1"
      changed_when: false

    - name: Check Store apps, Windows Terminal settings and font
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          foreach ($package in 'Microsoft.WindowsTerminal', 'Microsoft.PowerShell') {
              if (-not (Get-AppxPackage -Name $package)) { throw "$package is not installed." }
          }
          $path = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json'
          $settings = [IO.File]::ReadAllText($path) | ConvertFrom-Json
          if ($settings.profiles.defaults.colorScheme -ne 'Catppuccin Mocha') { throw 'Managed defaults are missing.' }
          $msys2 = $settings.profiles.list | Where-Object { $_.name -eq 'MSYS2' }
          if ($msys2.commandline -notlike 'C:\msys64\msys2_shell.cmd *') { throw "MSYS2 profile: $($msys2.commandline)" }
          if ($msys2.environment.HOME -ne "/home/$env:USERNAME") { throw "MSYS2 HOME: $($msys2.environment.HOME)" }
          $fonts = foreach ($key in 'HKCU:', 'HKLM:') {
              (Get-ItemProperty "$key\Software\Microsoft\Windows NT\CurrentVersion\Fonts" -ErrorAction SilentlyContinue).PSObject.Properties.Name
          }
          if (-not ($fonts -like 'MapleMono-NF-CN-Regular*')) { throw 'Maple Mono NF CN is not registered.' }

    - name: Check WSL settings
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $lines = [IO.File]::ReadAllLines((Join-Path $env:USERPROFILE '.wslconfig'))
          foreach ($line in 'networkingMode=Mirrored', 'telemetry=false', 'autoMemoryReclaim=Gradual', 'hostAddressLoopback=true') {
              if ($lines -notcontains $line) { throw "Missing $line in .wslconfig" }
          }

    - name: Check Windows development drive
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          $path = Join-Path $env:USERPROFILE 'AppData\Local\Dev.vhdx'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\AutoAttachVirtualDisks'
          if (-not (Get-ChildItem -LiteralPath $key | Where-Object { $_.GetValue('Path') -eq $path })) {
              throw "Not attached at boot: $path"
          }
          $image = Get-DiskImage -ImagePath $path
          if (-not $image.Attached) { throw "Not attached: $path" }
          $letter = Get-CimInstance Win32_DiskDrive | Where-Object { $_.DeviceID -eq $image.DevicePath } |
              Get-CimAssociatedInstance -ResultClassName Win32_DiskPartition |
              Get-CimAssociatedInstance -ResultClassName Win32_LogicalDisk |
              Select-Object -First 1 -ExpandProperty DeviceID
          $expected = [Environment]::GetEnvironmentVariable('DEV_DRIVE', 'User')
          if ($letter -ne $expected) { throw "DEV_DRIVE is '$expected' but the drive is '$letter'" }

    - name: Inspect WSL development drive task
      community.windows.win_scheduled_task_stat:
        path: \
        name: WSL Attach Dev VHDX
      register: dev_drive_task
      failed_when: not dev_drive_task.task_exists

    - name: Inspect Developer Mode
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
        name: AllowDevelopmentWithoutDevLicense
      register: developer_mode
      failed_when: developer_mode.value | default(0) != 1
