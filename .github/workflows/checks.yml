name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tool versions
        id: tool-versions
        run: |
          shfmt="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/mvdan/sh/releases/latest | sed 's#.*/tag/##')"
          ruff="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/astral-sh/ruff/releases/latest | sed 's#.*/tag/##')"
          nu="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/nushell/nushell/releases/latest | sed 's#.*/tag/##')"
          fish="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/fish-shell/fish-shell/releases/latest | sed 's#.*/tag/##')"
          {
            echo "shfmt=$shfmt"
            echo "ruff=$ruff"
            echo "nu=$nu"
            echo "fish=$fish"
          } >> "$GITHUB_OUTPUT"

      - name: Set cache week
        id: cache-week
        run: echo "week=$(date +%Y%W)" >> "$GITHUB_OUTPUT"

      - name: Cache binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ runner.os }}-${{ steps.tool-versions.outputs.shfmt }}-${{ steps.tool-versions.outputs.ruff }}-${{ steps.tool-versions.outputs.nu }}-${{ steps.tool-versions.outputs.fish }}

      - name: Resolve package versions
        id: package-versions
        run: |
          sudo apt-get update
          version_of() {
            LC_ALL=C apt-cache policy "$1" | sed -n 's/^ *Candidate: *//p'
          }
          zsh="$(version_of zsh)"
          zsh_common="$(version_of zsh-common)"
          lua="$(version_of lua5.5)"
          for version in "$zsh" "$zsh_common" "$lua"; do
            if [ -z "$version" ]; then
              echo "apt-cache returned no candidate version" >&2
              exit 1
            fi
          done
          {
            echo "zsh=$zsh"
            echo "zsh_common=$zsh_common"
            echo "lua=$lua"
          } >> "$GITHUB_OUTPUT"

      - name: Cache zsh and Lua packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/shell-deb
          key: zsh-lua-${{ runner.os }}-${{ steps.package-versions.outputs.zsh }}-${{ steps.package-versions.outputs.zsh_common }}-${{ steps.package-versions.outputs.lua }}

      - name: Cache pipx tools
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/pipx
            ${{ runner.temp }}/pipx-bin
            ~/.cache/pip
          key: pipx-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: |
            pipx-${{ runner.os }}-

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
          restore-keys: |
            ansible-collections-${{ runner.os }}-

      - name: Install binaries
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          if [ ! -x "$RUNNER_TEMP/tools/shfmt" ]; then
            curl -fsSL "https://github.com/mvdan/sh/releases/download/${{ steps.tool-versions.outputs.shfmt }}/shfmt_${{ steps.tool-versions.outputs.shfmt }}_linux_amd64" -o "$RUNNER_TEMP/tools/shfmt"
            chmod +x "$RUNNER_TEMP/tools/shfmt"
          fi
          if [ ! -x "$RUNNER_TEMP/tools/ruff" ]; then
            curl -fsSL "https://github.com/astral-sh/ruff/releases/download/${{ steps.tool-versions.outputs.ruff }}/ruff-x86_64-unknown-linux-gnu.tar.gz" |
              tar -xz -C "$RUNNER_TEMP/tools" --strip-components=1 "ruff-x86_64-unknown-linux-gnu/ruff"
            chmod +x "$RUNNER_TEMP/tools/ruff"
          fi
          if [ ! -x "$RUNNER_TEMP/tools/nu" ]; then
            curl -fsSL "https://github.com/nushell/nushell/releases/download/${{ steps.tool-versions.outputs.nu }}/nu-${{ steps.tool-versions.outputs.nu }}-x86_64-unknown-linux-gnu.tar.gz" |
              tar -xz -C "$RUNNER_TEMP/tools" --strip-components=1 "nu-${{ steps.tool-versions.outputs.nu }}-x86_64-unknown-linux-gnu/nu"
            chmod +x "$RUNNER_TEMP/tools/nu"
          fi
          if [ ! -x "$RUNNER_TEMP/tools/fish" ]; then
            curl -fsSL "https://github.com/fish-shell/fish-shell/releases/download/${{ steps.tool-versions.outputs.fish }}/fish-${{ steps.tool-versions.outputs.fish }}-linux-x86_64.tar.xz" |
              tar -xJ -C "$RUNNER_TEMP/tools" fish
            chmod +x "$RUNNER_TEMP/tools/fish"
          fi
          ln -sf fish "$RUNNER_TEMP/tools/fish_indent"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Install zsh and Lua packages
        env:
          ZSH_VERSION: ${{ steps.package-versions.outputs.zsh }}
          ZSH_COMMON_VERSION: ${{ steps.package-versions.outputs.zsh_common }}
          LUA_VERSION: ${{ steps.package-versions.outputs.lua }}
        run: |
          if [ -z "$(ls -A "$RUNNER_TEMP/shell-deb" 2>/dev/null)" ]; then
            mkdir -p "$RUNNER_TEMP/shell-deb"
            cd "$RUNNER_TEMP/shell-deb"
            # apt-get download does not resolve dependencies; zsh depends on zsh-common.
            apt-get download "zsh=$ZSH_VERSION" "zsh-common=$ZSH_COMMON_VERSION" "lua5.5=$LUA_VERSION"
          fi
          sudo dpkg -i "$RUNNER_TEMP/shell-deb"/*.deb

      - name: Install Ansible lint
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          pipx upgrade ansible-lint >/dev/null 2>&1 || pipx install ansible-lint
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        working-directory: ansible
        run: |
          lint_bin="$(dirname "$(readlink -f "$(command -v ansible-lint)")")"
          PATH="$lint_bin:$PATH" ansible-galaxy collection install -r requirements.yml

      - name: Encoding
        run: git ls-files -z | xargs -0 -r pwsh -NoProfile -File scripts/check-encoding.ps1

      - name: PowerShell format
        run: git ls-files -z '*.ps1' | xargs -0 -r pwsh -NoProfile -File scripts/format-powershell.ps1 -Check

      - name: PowerShell lint
        run: git ls-files -z '*.ps1' | xargs -0 -r pwsh -NoProfile -File scripts/lint-powershell.ps1

      - name: Ruff format
        run: git ls-files -z '*.py' | xargs -0 -r ruff format --check

      - name: Ruff check
        run: git ls-files -z '*.py' | xargs -0 -r ruff check

      - name: shfmt
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r shfmt -d -i 4 -ci -ln bash

      - name: shfmt-zsh
        run: git ls-files -z '*.zsh' | xargs -0 -r shfmt -d -ln zsh -i 4 -ci

      - name: ShellCheck
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r shellcheck -x

      - name: zsh
        run: git ls-files -z '*.zsh' | xargs -0 -r zsh -n

      - name: fish-format
        run: git ls-files -z '*.fish' | xargs -0 -r sh scripts/check-fish-format.sh

      - name: fish
        run: git ls-files -z '*.fish' | xargs -0 -r fish --no-execute

      - name: yamllint
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 -r yamllint -f parsable

      - name: JSON
        run: git ls-files -z '*.json' '*.jsonc' | xargs -0 -r pwsh -NoProfile -File scripts/check-json.ps1

      - name: Nushell
        run: git ls-files -z '*.nu' | xargs -0 -r pwsh -NoProfile -File scripts/check-nushell.ps1

      - name: jq
        run: git ls-files -z '*.jq' | xargs -0 -r pwsh -NoProfile -File scripts/check-jq.ps1

      - name: Lua
        run: git ls-files -z '*.lua' | xargs -0 -r luac -p

      - name: Ansible lint
        working-directory: ansible
        run: |
          lint_bin="$(dirname "$(readlink -f "$(command -v ansible-lint)")")"
          PATH="$lint_bin:$PATH" ansible-lint site.yml ../tests/prepare.yml ../tests/verify.yml
