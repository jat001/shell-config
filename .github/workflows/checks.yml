name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Install Ruff
        run: |
          pipx install ruff

      - name: Install Ansible lint
        run: |
          pipx install ansible-lint

      - name: Install PSScriptAnalyzer
        run: |
          pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }"

      - name: Install Ansible collections
        working-directory: ansible
        run: |
          lint_bin="$(dirname "$(readlink -f "$(command -v ansible-lint)")")"
          PATH="$lint_bin:$PATH" ansible-galaxy collection install -r requirements.yml

      - name: Check
        run: |
          ruff check $(git ls-files '*.py')
          ruff format --check $(git ls-files '*.py')
          shellcheck -x $(git ls-files '*.sh' '*.bash')
          shfmt -d -i 4 -ci -ln bash $(git ls-files '*.sh' '*.bash')
          yamllint -f parsable $(git ls-files '*.yml' '*.yaml')
          pwsh -NoProfile -File scripts/format-powershell.ps1 -Check
          pwsh -NoProfile -File scripts/lint-powershell.ps1
          pwsh -NoProfile -File scripts/check-json.ps1
          pwsh -NoProfile -File scripts/check-encoding.ps1 $(git ls-files)

      - name: Ansible lint
        working-directory: ansible
        env:
          ANSIBLE_DEPRECATION_WARNINGS: "false"
        run: |
          lint_bin="$(dirname "$(readlink -f "$(command -v ansible-lint)")")"
          PATH="$lint_bin:$PATH" ansible-lint site.yml ../tests/prepare.yml ../tests/verify.yml
